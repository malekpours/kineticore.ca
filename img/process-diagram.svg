<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8963"/>
      <stop offset="1" stop-color="#ecb454"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f6b4f"/>
    </marker>
  </defs>

  <!-- Step 1: Feedstock -->
  <rect x="10" y="60" width="190" height="150" rx="14" fill="#ffffff" stroke="#dbe3df" stroke-width="1.5"/>
  <rect x="10" y="60" width="190" height="150" rx="14" fill="#eef8f2" opacity="0.6"/>
  <circle cx="105" cy="105" r="24" fill="#ddf1e5"/>
  <path d="M96 116c0-9 4-16 9-16s9 7 9 16z" fill="#1f6b4f"/>
  <path d="M105 100c0-8 3-14 7-16" stroke="#1f6b4f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="97" y="112" width="16" height="6" rx="2" fill="#7a5310"/>
  <text x="105" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0c2f22">1 · Feedstock</text>
  <text x="105" y="172" text-anchor="middle" font-size="11.5" fill="#51655c">Wood waste, residues,</text>
  <text x="105" y="187" text-anchor="middle" font-size="11.5" fill="#51655c">biomass — dried &amp; sized</text>

  <line x1="200" y1="135" x2="234" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Reactor -->
  <rect x="240" y="40" width="220" height="190" rx="14" fill="#0c2f22"/>
  <rect x="262" y="70" width="176" height="110" rx="8" fill="#123c2c" stroke="#2e8963" stroke-width="1.5"/>
  <path d="M275 165q18-40 36 0t36 0 36 0 36 0" stroke="#e0972d" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="350" cy="55" r="5" fill="#ecb454"/>
  <circle cx="380" cy="55" r="3" fill="#ecb454" opacity="0.6"/>
  <circle cx="330" cy="52" r="3" fill="#ecb454" opacity="0.4"/>
  <text x="350" y="152" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.85">350–700 °C · O₂-free</text>
  <text x="350" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2 · Pyrolysis Reactor</text>
  <text x="350" y="232" text-anchor="middle" font-size="11.5" fill="#7cc4a1">Thermal decomposition</text>

  <line x1="460" y1="135" x2="494" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Separation -->
  <rect x="500" y="60" width="200" height="150" rx="14" fill="#ffffff" stroke="#dbe3df" stroke-width="1.5"/>
  <path d="M560 90h80l-40 52z" fill="#ddf1e5" stroke="#1f6b4f" stroke-width="1.5"/>
  <circle cx="600" cy="88" r="10" fill="#ecb454" opacity="0.85"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0c2f22">3 · Separation</text>
  <text x="600" y="199" text-anchor="middle" font-size="11.5" fill="#51655c">Condensables vs. solids</text>

  <line x1="700" y1="135" x2="734" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Products -->
  <rect x="740" y="60" width="200" height="150" rx="14" fill="#ffffff" stroke="#dbe3df" stroke-width="1.5"/>
  <rect x="762" y="86" width="70" height="42" rx="7" fill="#123c2c"/>
  <text x="797" y="112" text-anchor="middle" font-size="11" fill="#ecb454" font-weight="700">Biochar</text>
  <rect x="848" y="86" width="70" height="42" rx="7" fill="#ddf1e5" stroke="#1f6b4f" stroke-width="1"/>
  <text x="883" y="112" text-anchor="middle" font-size="11" fill="#1f6b4f" font-weight="700">Syngas</text>
  <rect x="762" y="140" width="70" height="42" rx="7" fill="#fbeed6" stroke="#e0972d" stroke-width="1"/>
  <text x="797" y="166" text-anchor="middle" font-size="11" fill="#7a5310" font-weight="700">Bio-oil</text>
  <rect x="848" y="140" width="70" height="42" rx="7" fill="#eef2f0" stroke="#dbe3df" stroke-width="1"/>
  <text x="883" y="166" text-anchor="middle" font-size="11" fill="#51655c" font-weight="700">Heat</text>
  <text x="840" y="196" text-anchor="middle" font-size="11.5" fill="#51655c">Four revenue streams, one process</text>

  <line x1="940" y1="135" x2="974" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Applications -->
  <rect x="980" y="60" width="170" height="150" rx="14" fill="#eef8f2" stroke="#1f6b4f" stroke-width="1.5"/>
  <circle cx="1035" cy="100" r="16" fill="#1f6b4f"/>
  <path d="M1035 92v16M1029 100h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1080" cy="100" r="16" fill="#e0972d"/>
  <path d="M1080 92v16M1074 100h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1065" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0c2f22">5 · Deployment</text>
  <text x="1065" y="172" text-anchor="middle" font-size="11.5" fill="#51655c">Soil, filtration, energy,</text>
  <text x="1065" y="187" text-anchor="middle" font-size="11.5" fill="#51655c">monitoring &amp; QA</text>

  <!-- Recycle loop -->
  <path d="M350 40c0-24 490-24 570 0" fill="none" stroke="#7cc4a1" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="640" y="28" text-anchor="middle" font-size="11" fill="#2e8963" font-weight="600">syngas &amp; heat recycled to reactor</text>
</svg>
