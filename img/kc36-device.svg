<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a38"/>
      <stop offset="1" stop-color="#0c2f22"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f18"/>
      <stop offset="1" stop-color="#0f2e23"/>
    </linearGradient>
  </defs>

  <!-- Bench -->
  <rect x="30" y="330" width="500" height="10" rx="5" fill="#dbe3df"/>

  <!-- Main enclosure -->
  <rect x="80" y="80" width="400" height="250" rx="18" fill="url(#caseGrad)"/>
  <rect x="80" y="80" width="400" height="250" rx="18" fill="none" stroke="#2e8963" stroke-width="1.5" opacity="0.6"/>

  <!-- Handle -->
  <rect x="250" y="64" width="60" height="22" rx="8" fill="none" stroke="#2e8963" stroke-width="3"/>

  <!-- Screen -->
  <rect x="104" y="104" width="230" height="130" rx="10" fill="url(#screenGrad)" stroke="#2e8963" stroke-width="1.5"/>
  <polyline points="116,204 140,180 164,192 188,160 212,172 236,148 260,164 284,136 308,150 320,128" fill="none" stroke="#ecb454" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="116,214 150,204 190,208 230,196 270,202 320,192" fill="none" stroke="#43a37b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <text x="118" y="126" font-size="11" fill="#7cc4a1" font-weight="600">CH 01–36 · LIVE</text>
  <circle cx="316" cy="118" r="4" fill="#e05c4f"/>

  <!-- LEDs -->
  <circle cx="356" cy="112" r="5" fill="#43a37b"/>
  <circle cx="372" cy="112" r="5" fill="#ecb454"/>
  <circle cx="388" cy="112" r="5" fill="#e05c4f" opacity="0.4"/>

  <!-- Vent grill -->
  <g fill="#0a1f18">
    <rect x="352" y="132" width="104" height="6" rx="3"/>
    <rect x="352" y="144" width="104" height="6" rx="3"/>
    <rect x="352" y="156" width="104" height="6" rx="3"/>
    <rect x="352" y="168" width="104" height="6" rx="3"/>
  </g>

  <!-- Thermocouple connector panel -->
  <rect x="104" y="252" width="352" height="54" rx="9" fill="#0a1f18" stroke="#2e8963" stroke-width="1"/>
  <!-- Row 1: mini plugs (amber) -->
  <g fill="#e0972d">
    <rect x="116" y="262" width="18" height="14" rx="3"/>
    <rect x="140" y="262" width="18" height="14" rx="3"/>
    <rect x="164" y="262" width="18" height="14" rx="3"/>
    <rect x="188" y="262" width="18" height="14" rx="3"/>
    <rect x="212" y="262" width="18" height="14" rx="3"/>
    <rect x="236" y="262" width="18" height="14" rx="3"/>
    <rect x="260" y="262" width="18" height="14" rx="3"/>
    <rect x="284" y="262" width="18" height="14" rx="3"/>
  </g>
  <!-- Row 2: standard plugs (green) -->
  <g fill="#2e8963">
    <rect x="116" y="284" width="18" height="14" rx="3"/>
    <rect x="140" y="284" width="18" height="14" rx="3"/>
    <rect x="164" y="284" width="18" height="14" rx="3"/>
    <rect x="188" y="284" width="18" height="14" rx="3"/>
    <rect x="212" y="284" width="18" height="14" rx="3"/>
    <rect x="236" y="284" width="18" height="14" rx="3"/>
    <rect x="260" y="284" width="18" height="14" rx="3"/>
    <rect x="284" y="284" width="18" height="14" rx="3"/>
  </g>
  <!-- Label -->
  <text x="438" y="278" font-size="10" fill="#7cc4a1" text-anchor="middle" font-weight="600">36 × K-TYPE</text>
  <text x="438" y="292" font-size="9" fill="#51655c" text-anchor="middle">TC INPUTS</text>
</svg>
